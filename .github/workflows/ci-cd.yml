name: CI/CD

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Lint with ruff
        run: |
          ruff check .
      - name: Test with pytest
        run: |
          pytest

  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot app and smoke test
        run: |
          python server.py &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          # Wait for the server to accept connections (up to ~30s).
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8080/health > /dev/null

          # Root returns the success envelope.
          curl -fsS http://127.0.0.1:8080/ | grep -o '"status": "success"' > /dev/null

          # /5 returns exactly five laws and the count headers.
          curl -fsS http://127.0.0.1:8080/5 | grep -o '"returnCount": 5' > /dev/null
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/5 | grep -i '^x-count: 5'

          # Unknown MULTI-SEGMENT routes produce a JSON 404 envelope.
          # (A single unknown segment like /foo matches /<number> and 400s instead.)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/some/nonexistent/path)
          [ "$CODE" = "404" ] || { echo "expected 404, got $CODE"; exit 1; }

          echo "Smoke test passed."
