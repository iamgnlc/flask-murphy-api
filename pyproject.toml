[project]
name = "flask-murphy-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "blinker==1.9.0",
    "camel-converter==5.1.1",
    "click==8.5.0",
    "colorama==0.4.6",
    "Flask==3.1.3",
    "flask-limiter==4.1.1",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "packaging==26.3",
    "py-healthcheck==1.10.1",
    "python-dotenv==1.2.3",
    "redis==8.1.0",
    "six==1.17.0",  # imported by py-healthcheck but not declared by it
    "waitress==3.0.2",
    "Werkzeug==3.1.8",
]

[project.optional-dependencies]
dev = [
    "coverage==7.16.1",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "pytest-cov==7.1.0",
    "pytest==9.1.1",
    "ruff>=0.14",
]

[tool.black]

[tool.pytest.ini_options]
testpaths = ["tests"]
